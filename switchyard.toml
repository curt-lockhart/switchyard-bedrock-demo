schema_version = 1

# ─── LLM Clients ──────────────────────────────────────────────────────────────
[llm_clients.bedrock]
format      = "openai_chat"
base_url    = "https://bedrock-mantle.us-east-1.api.aws/v1"
api_key_env = "BEDROCK_API_KEY"

[llm_clients.bedrock-openai]
format      = "openai_chat"
base_url    = "https://bedrock-mantle.us-east-1.api.aws/openai/v1"
api_key_env = "BEDROCK_API_KEY"

# ─── Targets ──────────────────────────────────────────────────────────────────
# Tier 1 – Fast & cheap. Handles simple tickets.
[targets.nano]
id         = "nvidia.nemotron-nano-3-30b"
llm_client = "bedrock"

# Tier 2 – Mid-tier. Moderate complexity tickets.
[targets.super]
id         = "nvidia.nemotron-super-3-120b"
llm_client = "bedrock"

# Tier 3 – Most capable. Complex, high-risk tickets.
[targets.sol]
id         = "openai.gpt-5.6-sol"
llm_client = "bedrock-openai"

# ─── Routes ───────────────────────────────────────────────────────────────────

# Route 1: LLM Classifier — Super judges upfront by rules, routes to Nano or Sol.
# The judge is Super, not Nano: Nano did not follow the enterprise AND blocked rule reliably.
[routes.support-triage-classifier]
id                = "support-triage-classifier"
type              = "llm_classifier"
mode              = "custom"
default_target    = "sol"
classify_trigger  = "user_turn"
prompt            = """
Route this support ticket. Answer sol if any of these rules applies, otherwise answer nano.

1. Customer Tier is enterprise AND the customer is blocked: they cannot log in, cannot work or cannot use the product.
2. Fraud or a security problem: account takeover, charges or changes they did not make, exposed personal data.
3. Data loss or an outage.
4. A legal threat, a chargeback, or an urgent deadline with money at risk.

Not sol: a double charge on the customer's own order (routine billing), or a routine question from any Customer Tier.

Return JSON matching the response schema supplied with the request.
"""
response_schema   = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["nano", "sol"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.support-triage-classifier.models]
judge = ["super"]
nano  = ["nano"]
sol   = ["sol"]
any   = ["nano", "sol"]

[routes.support-triage-classifier.policy]
type     = "target_selector"
selector = "/decision/target"

# Route 2: Custom 3-tier — Super judges upfront by rules, routes to Nano / Super / Sol
[routes.support-triage-3tier]
id                = "support-triage-3tier"
type              = "llm_classifier"
mode              = "custom"
default_target    = "sol"
classify_trigger  = "user_turn"
prompt            = """
Route this support ticket. Check the rules in order and use the first one that applies.

1. sol: Customer Tier is enterprise AND the customer is blocked (cannot log in, cannot work or cannot use the product).
2. sol: fraud or a security problem (account takeover, charges or changes they did not make, exposed personal data), data loss or an outage, a legal threat or a chargeback, or an urgent deadline with money at risk.
3. super: the customer is blocked or something went wrong that needs investigating: they cannot log in or use the product, a payment or order failed or is wrong, a billing dispute, or troubleshooting that takes several steps.
4. nano: everything else, including questions about policies, prices, payment methods, delivery options, invoices or order status, and simple changes to an account, order or address.

Customer Tier only matters for rule 1.

Return JSON matching the response schema supplied with the request.
"""
response_schema   = '''
{
  "type": "object",
  "properties": {
    "decision": {
      "type": "object",
      "properties": {
        "target": {
          "type": "string",
          "enum": ["nano", "super", "sol"]
        }
      },
      "required": ["target"],
      "additionalProperties": false
    }
  },
  "required": ["decision"],
  "additionalProperties": false
}
'''

[routes.support-triage-3tier.models]
judge = ["super"]
nano  = ["nano"]
super = ["super"]
sol   = ["sol"]
any   = ["nano", "super", "sol"]

[routes.support-triage-3tier.policy]
type     = "target_selector"
selector = "/decision/target"

# Route 3: Passthrough — all tickets go to Sol (baseline for cost comparison)
[routes.baseline]
id     = "baseline"
type   = "passthrough"
target = "sol"
